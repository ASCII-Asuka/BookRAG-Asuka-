# EviBridge-RAG minimal runnable template.
# Fill pdf_path, save_path, and model endpoints before running.

pdf_path: TODO
save_path: TODO
index_type: evibridge
rag_force_reprocess: true

llm:
  model_name: TODO
  api_key: TODO
  api_base: TODO
  backend: openai
  max_tokens: 5000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 1

vlm:
  model_name: TODO
  api_key: TODO
  api_base: TODO
  backend: ollama
  temperature: 0.1
  max_tokens: 6000

mineru:
  backend: pipeline
  method: auto
  server_url: http://127.0.0.1:30000
  lang: en

tree:
  node_keywords: true
  node_summary: false
  use_vlm: false

vdb:
  mm_embedding: false
  vdb_dir_name: "Tree_vdb"
  collection_name: "TreeVDB"
  force_rebuild: true

rag:
  strategy: evibridge
  ablation_variant: full
  demand_parser: hybrid
  demand_confidence_threshold: 0.7
  bm25_topk: 20
  embedding_topk: 20
  patch_topk: 5
  entity_topk: 10
  enable_vector_recall: false
  hybrid_bm25_weight: 0.55
  hybrid_vector_weight: 0.45
  ppr_topk: 30
  ppr_restart_alpha: 0.15
  ppr_max_iter: 50
  enable_shortest_path_connector: true
  connector_max_paths: 3
  max_context_blocks: 10
  max_context_tokens: 4000
  max_iterations: 2
  enable_llm_verifier: true
  output_evidence_chain: true
  evibridge_vdb_config:
    mm_embedding: false
    vdb_dir_name: "EviBridge_vdb"
    collection_name: "EviBridgeBlockVDB"
    force_rebuild: true
    embedding_config:
      type: text
      backend: openai
      model_name: TODO
      api_key: TODO
      api_base: TODO
      max_length: 4096
      device: cpu
