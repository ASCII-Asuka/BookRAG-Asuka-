# EviBridge-RAG Qasper-oriented hybrid + rerank template.
# Fill pdf_path, save_path, and model endpoints before running.

pdf_path: TODO
save_path: TODO
index_type: evibridge
rag_force_reprocess: true

llm:
  model_name: TODO
  api_key: TODO
  api_base: TODO
  backend: openai
  max_tokens: 5000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 1

vlm:
  model_name: TODO
  api_key: TODO
  api_base: TODO
  backend: ollama
  temperature: 0.1
  max_tokens: 6000

mineru:
  backend: pipeline
  method: auto
  server_url: http://127.0.0.1:30000
  lang: en

tree:
  node_keywords: true
  node_summary: false
  use_vlm: false

vdb:
  mm_embedding: false
  vdb_dir_name: "Tree_vdb"
  collection_name: "TreeVDB"
  force_rebuild: true

rag:
  strategy: evibridge
  ablation_variant: full
  demand_parser: hybrid
  demand_confidence_threshold: 0.7
  qasper_demand_mode: conservative
  enable_boolean_answer_hint: true
  multi_hop_requires_explicit_bridge: true
  bm25_topk: 40
  embedding_topk: 50
  patch_topk: 5
  entity_topk: 10
  enable_vector_recall: true
  hybrid_bm25_weight: 0.35
  hybrid_vector_weight: 0.65
  enable_candidate_rerank: true
  candidate_rerank_topk: 50
  candidate_rerank_weight: 0.75
  enable_supporting_rerank: true
  rerank_batch_size: 50
  trust_answer_supporting_ids: false
  ppr_topk: 60
  ppr_restart_alpha: 0.15
  ppr_max_iter: 50
  enable_shortest_path_connector: true
  connector_max_paths: 3
  preserve_seed_topk: 60
  final_evidence_types:
    - paragraph
    - table
    - caption
    - figure
  bridge_auxiliary_types:
    - entity
    - summary
    - patch
    - title
  supporting_evidence_topk: 4
  supporting_evidence_types:
    - paragraph
    - table
    - caption
    - figure
  paragraph_quota: 4
  auxiliary_quota: 2
  max_context_blocks: 10
  max_context_tokens: 4000
  max_iterations: 2
  enable_llm_verifier: true
  output_evidence_chain: true
  evibridge_vdb_config:
    mm_embedding: false
    vdb_dir_name: "EviBridge_vdb"
    collection_name: "EviBridgeBlockVDB"
    force_rebuild: true
    embedding_config:
      type: text
      backend: openai
      model_name: TODO
      api_key: TODO
      api_base: TODO
      max_length: 32768
      device: cpu
  reranker_config:
    model_name: TODO
    api_key: TODO
    api_base: TODO
    backend: vllm
    max_length: 4096
    device: cpu
